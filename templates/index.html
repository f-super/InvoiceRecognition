<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票信息批量提取工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container-card">
        <div class="title">发票信息批量提取工具</div>
        <div class="subtitle">支持目录扫描 / 文件上传,实时进度推送,自动生成 Excel</div>

        <ul class="nav nav-tabs mb-4" id="tabNav" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#scan">扫描目录</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#upload">上传文件</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="scan">
                <label class="form-label">选择目录(从白名单根目录逐层进入):</label>

                <!-- 面包屑导航 -->
                <div id="breadcrumb" class="d-flex align-items-center mb-2 flex-wrap gap-1"></div>

                <!-- 子目录列表 -->
                <div id="dirList" class="file-list mb-3" style="height: 280px;"></div>

                <!-- 手动输入完整路径(高级用法) -->
                <div class="input-group mb-3">
                    <input type="text" id="dirPath" class="form-control"
                           placeholder="或手动输入完整路径(如 D:\发票目录)">
                    <button class="btn btn-outline-primary" id="scanBtn">扫描此路径</button>
                </div>

                <div id="scanResult" class="file-list mb-3"></div>
                <button class="btn btn-warning btn-lg w-100" id="processPathBtn" disabled>开始提取</button>
            </div>

            <div class="tab-pane fade" id="upload">
                <input type="file" id="fileInput" class="form-control mb-3" multiple accept=".pdf">
                <div id="uploadList" class="file-list mb-3"></div>
                <button class="btn btn-warning btn-lg w-100" id="uploadBtn" disabled>开始提取</button>
            </div>
        </div>

        <div class="mt-4">
            <label class="form-label">处理进度</label>
            <div class="progress mb-2">
                <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
            </div>
            <div id="logArea"></div>
            <div id="downloadArea" class="mt-3 text-center"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
